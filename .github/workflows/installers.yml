# Gera os instaladores do Rotaz: .exe (Windows), .dmg (macOS universal, Intel e Apple Silicon), .AppImage e .deb (Linux x64).
# Dispara ao publicar uma tag "v*" ou manualmente pela aba Actions. Com tag, publica uma Release com os
# instaladores.
# Sem certificados configurados, os instaladores saem sem assinatura (veja README, "Assinatura").
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Dependências do app desktop
        working-directory: desktop
        run: npm ci

      - name: Gerar instalador
        working-directory: desktop
        shell: bash
        env:
          # Assinatura opcional: cadastre estes segredos no repositório para assinar e notarizar.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Sem certificado, as variáveis chegam vazias e o electron-builder trataria o valor vazio como caminho.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: rotaz-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            # Usados pela atualização automática: o app lê latest.yml e baixa só o que mudou com o .blockmap.
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    # Só para tags de versão: junta os instaladores e publica a Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Só para ler o CHANGELOG.md: as notas da Release saem da seção da versão.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Notas da Release: primeiro, qual arquivo baixar (montado com os arquivos que o build gerou de fato);
          # depois, as novidades da seção "## <versão>" do CHANGELOG.md. Sem essa seção, entram as notas automáticas.
          v="${GITHUB_REF_NAME#v}"
          url="${{ github.server_url }}/${{ github.repository }}"
          row() { # sistema, padrão do nome do arquivo, como instalar
            f=$(cd instaladores && ls $2 2>/dev/null | head -n1)
            if [ -n "$f" ]; then echo "| $1 | [\`$f\`]($url/releases/download/$GITHUB_REF_NAME/$f) | $3 |"; fi
          }
          {
            echo "## Download"
            echo
            echo "Download **only the file for your system**. · Baixe **só o arquivo do seu sistema**."
            echo
            echo "| System · Sistema | File · Arquivo | How to install · Como instalar |"
            echo "| --- | --- | --- |"
            row "Windows 10/11" "*-Windows-x64-Setup.exe" "Run the installer · Rode o instalador"
            row "macOS (Apple Silicon, Intel)" "*-macOS-universal.dmg" "Open it and drag Rotaz to Applications · Abra e arraste o Rotaz para Aplicativos"
            row "Ubuntu, Debian" "*-Linux-*.deb" "\`sudo apt install ./<file>\`"
            row "Linux x64" "*-Linux-*.AppImage" "\`chmod +x\` and open it · \`chmod +x\` e abra"
            echo
            echo "- **Already using Rotaz on Windows?** It updates itself, no download needed. · **Já usa o Rotaz no Windows?** Ele se atualiza sozinho."
            echo "- **Ignore** the \`.yml\` and \`.blockmap\` files: they are for automatic updates. · **Ignore** os arquivos \`.yml\` e \`.blockmap\`: são da atualização automática."
            echo "- The installers aren't code-signed yet, so your system asks for confirmation the first time. · Os instaladores ainda não têm assinatura digital: o sistema pede confirmação na primeira vez."
          } > notas.md
          awk -v v="$v" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > novidades.md
          notes=(--notes-file notas.md)
          if [ -s novidades.md ]; then
            { echo; echo "## What's new · Novidades"; cat novidades.md; echo; echo "**Full changelog · Todas as mudanças:** $url/commits/$GITHUB_REF_NAME"; } >> notas.md
          else
            notes+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" instaladores/* --repo "${{ github.repository }}" --title "Rotaz $GITHUB_REF_NAME" "${notes[@]}"
