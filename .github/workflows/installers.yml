# Gera os instaladores do Rotaz: .exe (Windows), .dmg (macOS universal, Intel e Apple Silicon) e .AppImage (Linux x64).
# Dispara ao publicar uma tag "v*" ou manualmente pela aba Actions. Com tag, publica uma Release com os três
# instaladores.
# Sem certificados configurados, os instaladores saem sem assinatura (veja README, "Assinatura").
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Dependências do app desktop
        working-directory: desktop
        run: npm ci

      - name: Gerar instalador
        working-directory: desktop
        shell: bash
        env:
          # Assinatura opcional: cadastre estes segredos no repositório para assinar e notarizar.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Sem certificado, as variáveis chegam vazias e o electron-builder trataria o valor vazio como caminho.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: rotaz-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            # Usados pela atualização automática: o app lê latest.yml e baixa só o que mudou com o .blockmap.
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    # Só para tags de versão: junta os instaladores e publica a Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" instaladores/* --repo "${{ github.repository }}" --title "Rotaz ${{ github.ref_name }}" --generate-notes
